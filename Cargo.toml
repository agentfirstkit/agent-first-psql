[package]
name = "agent-first-psql"
version = "0.11.0"
edition = "2024"
default-run = "afpsql"
description = "A PostgreSQL interface for AI agents: reliable, structured, explicit, and read-only by default."
license = "MIT"
repository = "https://github.com/agentfirstkit/agent-first-psql"
readme = "README.md"
exclude = [".github/"]

[features]
default = ["ui"]
# Enables integration tests that require a live PostgreSQL DSN.
db-tests = []
# `afpsql ui`: isolated windows over the same queries `afpsql inspect` runs.
ui = ["agent-first-ui/session", "agent-first-ui/page", "dep:axum"]

[[bin]]
# Keep afpsql first: release tooling derives the primary artifact name from it.
name = "afpsql"
path = "src/main.rs"

[[bin]]
name = "afpsql-readonly"
path = "src/readonly_main.rs"

[dependencies]
agent-first-data = { version = "0.34.0", default-features = false, features = ["cli", "skill-admin", "stream-redirect", "yaml", "toml", "dotenv", "ini"] }
# `session`: every panel is a window over a served AFUI session, with the
# frontend overlay and its script guard underneath it. `page` is the other,
# orthogonal tier: turning a frontend's files into a rendered page — the
# MiniJinja policy, the render, the rendered-markup guard, the runtime-marker
# and required-element checks. Both are wanted here; neither implies the other.
agent-first-ui = { version = "0.5.0", default-features = false, optional = true }
async-trait = "0.1"
axum = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = "0.3"
native-tls = "0.2"
postgres-native-tls = "0.5"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
# What a consumer's tests need to arrange the world AFUI reads from: a frontend
# on disk and trusted, with AFUI computing the fingerprint through the same
# code it trusts against rather than this suite keeping a copy of it.
agent-first-ui = { version = "0.5.0", default-features = false, features = ["test-support"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
